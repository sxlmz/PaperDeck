<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; }
.slide {
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:#EEF2F7; color:#1E293B;
}
.slide::before {
  content:""; position:absolute; left:0; top:0; width:100%; height:100%;
  background:
    radial-gradient(circle at 8% 10%, rgba(37,99,235,.06) 0, transparent 40%),
    radial-gradient(circle at 92% 90%, rgba(14,165,233,.05) 0, transparent 40%);
}
.kicker { position:absolute; left:84px; top:44px; font-size:17px;
  letter-spacing:6px; color:#0284C7; font-weight:700; }
.title {
  position:absolute; left:84px; top:86px; width:1110px;
  font-size:37px; font-weight:800; color:#0F172A; line-height:1.25;
}
.lead {
  position:absolute; left:84px; top:172px; width:1100px;
  font-size:22px; font-weight:700; color:#1D4ED8; line-height:1.4;
}
/* 顶部双结论 */
.top-notes {
  position:absolute; left:84px; right:72px; top:230px;
  display:flex; gap:20px;
}
.note {
  flex:1; padding:14px 18px; border-radius:12px;
  background:#EFF6FF; border-left:4px solid #2563EB;
  font-size:16px; line-height:1.5; color:#1E3A8A;
}
.note.n2 { background:#F0FDF4; border-left-color:#16A34A; color:#14532D; }
.note b { color:#0F172A; }
/* 双图区 */
.fig-row {
  position:absolute; left:84px; right:72px; top:330px; bottom:64px;
  display:flex; gap:20px;
}
.fig {
  flex:1; background:transparent;
  padding:14px; display:flex; flex-direction:column;
}
.fig .imgbox { flex:1; min-height:0; display:flex; align-items:center;
  justify-content:center; overflow:hidden; }
.fig img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
.fig .cap {
  margin-top:10px; font-size:13px; color:#475569; line-height:1.45;
  font-weight:600;
}
.foot {
  position:absolute; left:84px; right:72px; bottom:32px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:15px; color:#64748B; font-weight:600;
}
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="lead">{{LEAD}}</div>
  <div class="top-notes">
    <div class="note">{{NOTE_1}}</div>
    <div class="note n2">{{NOTE_2}}</div>
  </div>
  <div class="fig-row">
    <div class="fig">
      <div class="imgbox"><img src="{{IMG_1}}"></div>
      <div class="cap">{{CAP_1}}</div>
    </div>
    <div class="fig">
      <div class="imgbox"><img src="{{IMG_2}}"></div>
      <div class="cap">{{CAP_2}}</div>
    </div>
  </div>
  <div class="foot"><div>{{SOURCE}}</div><div>{{PAGE}}</div></div>
</div>
</body>
</html>
