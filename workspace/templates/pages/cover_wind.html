<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#FFFFFF; }
.slide { position:relative; width:1280px; height:720px; background:#FFFFFF; }
.top-band { position:absolute; left:0; top:0; width:1280px; height:531px;
  background:linear-gradient(180deg, #DBEAFB 0%, #EFF6FF 100%); }
.divider { position:absolute; left:0; top:529px; width:1280px; height:2px; background:#002060; }
.title { position:absolute; left:114px; top:210px; width:1059px;
  font-size:44px; font-weight:800; color:#002060; text-align:center; line-height:1.3; }
.gold-block { position:absolute; left:519px; top:495px; width:241px; height:67px;
  background:#F6D9A7; }
.gold-block::before { content:""; position:absolute; left:-10px; top:-1px; width:10px; height:31px;
  background:#D6AA74; }
.gold-block::after { content:""; position:absolute; right:-10px; top:-2px; width:10px; height:31px;
  background:#D6AA74; }
.presenter { position:absolute; left:537px; top:601px; width:186px;
  font-size:16px; font-weight:700; color:#002060; text-align:center; }
.motto { position:absolute; left:257px; top:672px; width:765px;
  font-size:12px; color:#64748B; text-align:center; letter-spacing:2px; }
</style>
</head>
<body>
<div class="slide">
  <div class="top-band"></div>
  <div class="divider"></div>
  <div class="title">{{TITLE}}</div>
  <div class="gold-block"></div>
  <div class="presenter">{{PRESENTER}}</div>
  <div class="motto">—  艰苦创业  开拓创新  争创一流  —</div>
</div>
</body>
</html>
