<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; }
.slide {
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:#EEF2F7; color:#1E293B;
}
.slide::before {
  content:""; position:absolute; left:0; top:0; width:100%; height:100%;
  background:
    radial-gradient(circle at 8% 10%, rgba(37,99,235,.06) 0, transparent 40%),
    radial-gradient(circle at 92% 90%, rgba(14,165,233,.05) 0, transparent 40%);
}
.kicker { position:absolute; left:84px; top:44px; font-size:17px;
  letter-spacing:6px; color:#0284C7; font-weight:700; }
.title {
  position:absolute; left:84px; top:86px; width:1110px;
  font-size:37px; font-weight:800; color:#0F172A; line-height:1.25;
}
.lead {
  position:absolute; left:84px; top:172px; width:1100px;
  font-size:22px; font-weight:700; color:#1D4ED8; line-height:1.4;
}
/* 大图区：图占主体，右侧要点列表 */
.figure-wrap {
  position:absolute; left:84px; right:72px; top:232px; bottom:64px;
  display:flex; gap:20px;
}
.fig-main {
  flex:1.45; background:transparent;
  padding:16px; display:flex; flex-direction:column; gap:10px;
  justify-content:center; align-items:center; overflow:hidden;
}
.fig-main .sub { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.fig-main .sub img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
.fig-main .sub .cap { font-size:16px; color:#64748B; line-height:1.45; font-weight:600; }
.fig-side {
  flex:1; display:flex; flex-direction:column; gap:12px; min-width:0;
}
.fig-point {
  flex:1; background:transparent;
  padding:14px 16px; border-left:4px solid #2563EB;
  display:flex; gap:12px; align-items:center;
}
.fig-point .no {
  font-size:30px; font-weight:800; line-height:1.2; min-width:40px;
  font-family:"Microsoft YaHei","微软雅黑",sans-serif;
}
.fig-point:nth-child(4n+1) .no { color:#2563EB; }
.fig-point:nth-child(4n+2) .no { color:#16A34A; }
.fig-point:nth-child(4n+3) .no { color:#EA580C; }
.fig-point:nth-child(4n+4) .no { color:#7C3AED; }
.fig-point .ph { font-size:27px; font-weight:700; color:#0F172A; margin-bottom:4px; }
.fig-point .cd { font-size:24px; line-height:1.45; color:#475569; }
.fig-point .ph, .fig-point .cd { } /* nofit applied in HTML below */
.foot {
  position:absolute; left:84px; right:72px; bottom:32px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:15px; color:#64748B; font-weight:600;
}
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="lead">{{LEAD}}</div>
  <div class="figure-wrap">
    <div class="fig-main">{{LEFT_BODY}}</div>
    <div class="fig-side">{{POINTS}}</div>
  </div>
  <div class="foot"><div>{{SOURCE}}</div><div>{{PAGE}}</div></div>
</div>
</body>
</html>
