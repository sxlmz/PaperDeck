<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#F5F5F0; }
.slide { position:relative; width:1280px; height:720px; background:#F5F5F0; }
.kicker { position:absolute; left:60px; top:36px; font-size:14px; color:#64748B; letter-spacing:3px; white-space:nowrap; }
.title { position:absolute; left:60px; top:60px; width:1160px; font-size:32px; font-weight:800; color:#0F172A; }
.subtitle { position:absolute; left:60px; top:110px; width:1160px; font-size:19px; color:#64748B; font-style:italic; }
.main { position:absolute; left:60px; top:160px; width:1160px; height:520px; display:flex; gap:24px; }
.left { flex:0 0 520px; padding:20px; display:flex; flex-direction:column; justify-content:center; }
.left .ct { font-size:14pt; font-weight:700; color:#0F172A; text-align:center; margin-bottom:10px; }
.left .cb { flex:1; display:flex; align-items:center; justify-content:center; }
.left .cb img, .left .cb svg, .left .cb div { max-width:100%; max-height:100%; }
.left .cap { font-size:12pt; color:#64748B; text-align:center; margin-top:8px; font-style:italic; }
.right { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:14px; align-content:stretch; }
.rcard { background:#FFFFFF; padding:16px 20px; position:relative; flex:1; }
.rcard::before { content:""; position:absolute; left:0; top:0; width:4px; height:100%; }
.rcard:nth-child(1)::before { background:#2563EB; }
.rcard:nth-child(2)::before { background:#16A34A; }
.rcard:nth-child(3)::before { background:#EA580C; }
.rcard:nth-child(4)::before { background:#7C3AED; }
.rcard .no { font-size:16px; font-weight:700; margin-bottom:4px; }
.rcard:nth-child(1) .no { color:#2563EB; }
.rcard:nth-child(2) .no { color:#16A34A; }
.rcard:nth-child(3) .no { color:#EA580C; }
.rcard:nth-child(4) .no { color:#7C3AED; }
.rcard .ch { font-size:16px; font-weight:800; color:#0F172A; margin-bottom:6px; }
.rcard .cd { font-size:14px; line-height:1.5; color:#334155; }
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="main">
    <div class="left">
      <div class="ct">{{CHART_TITLE}}</div>
      <div class="cb">{{CHART}}</div>
      <div class="cap">{{CAPTION}}</div>
    </div>
    <div class="right">{{CARDS}}</div>
  </div>
</div>
</body>
</html>
