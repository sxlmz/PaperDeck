<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; }
.slide {
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:#0F172A; color:#F8FAFC;
}
.slide::before {
  content:""; position:absolute; left:0; top:0; width:100%; height:100%;
  background:
    radial-gradient(circle at 88% 18%, rgba(124,58,237,.30) 0, transparent 45%),
    radial-gradient(circle at 12% 82%, rgba(37,99,235,.28) 0, transparent 45%);
}
.kicker {
  position:absolute; left:0; right:0; top:180px; text-align:center;
  font-size:18px; letter-spacing:10px; color:#7DD3FC; font-weight:700;
}
.title {
  position:absolute; left:0; right:0; top:240px; text-align:center;
  font-size:64px; font-weight:800; color:#FFFFFF;
}
.paper {
  position:absolute; left:0; right:0; top:380px; text-align:center;
  font-size:20px; color:#CBD5E1; line-height:1.6;
}
.authors {
  position:absolute; left:0; right:0; top:460px; text-align:center;
  font-size:16px; color:#94A3B8; line-height:1.8;
}
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="paper">{{PAPER}}</div>
  <div class="authors">{{AUTHORS}}</div>
</div>
</body>
</html>
