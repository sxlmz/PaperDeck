<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#F5F5F0; }
.slide { position:relative; width:1280px; height:720px; background:#F5F5F0; }
.kicker { position:absolute; left:60px; top:36px; font-size:14px; color:#64748B; letter-spacing:3px; white-space:nowrap; }
.title { position:absolute; left:60px; top:60px; width:1160px; font-size:32px; font-weight:800; color:#0F172A; }
.subtitle { position:absolute; left:60px; top:110px; width:1160px; font-size:19px; color:#64748B; font-style:italic; }
.tcap { position:absolute; left:60px; top:145px; width:1160px; font-size:19px; color:#475569; }
.table-wrap .cap { font-size:16px; color:#64748B; text-align:center; margin-top:8px; font-style:italic; }
.table-wrap { position:absolute; left:60px; top:180px; width:1160px; }
table { width:100%; border-collapse:collapse; font-family:'Times New Roman',serif; font-size:19px; }
thead th { border:1px solid #E2E8F0; border-top:2.5px solid #0F172A; border-bottom:1px solid #0F172A; background:#F1F5F9; padding:10px 12px; text-align:center; font-weight:700; color:#0F172A; }
tbody td { border:1px solid #E2E8F0; padding:9px 12px; text-align:center; color:#1E293B; }
tbody td:first-child { text-align:left; font-weight:600; }
tbody td.num { font-family:'Times New Roman',serif; font-weight:700; color:#2563EB; }
tbody tr:last-child td { border-bottom:2.5px solid #0F172A; }
.notes { position:absolute; left:0; top:560px; width:1280px; display:flex; gap:20px; }
.note { flex:1; background:#FFFFFF; position:relative; padding:12px 60px; }
.note.n2 { border-left-color:#16A34A; }
.note .txt { font-size:19px; line-height:1.5; color:#1E293B; ; width:100%; }
.note .bar, .summary .bar { position:absolute; left:0; top:0; width:4px; height:100%; background:#2563EB; }
.note.n2 .bar { background:#16A34A; }
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="tcap">{{TCAP}}</div>
  <div class="table-wrap">
    <table><thead><tr>{{THEAD}}</tr></thead><tbody>{{TBODY}}</tbody></table>
    <div class="cap">{{CAPTION}}</div>
  </div>
  <div class="notes">
    <div class="note n1"><div class="bar"></div><div class="txt">{{NOTE_1}}</div></div>
    <div class="note n2"><div class="bar"></div><div class="txt">{{NOTE_2}}</div></div>
  </div>
</div>
</body>
</html>
