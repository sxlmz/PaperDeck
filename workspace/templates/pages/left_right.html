<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#FFFFFF; }
.slide { position:relative; width:1280px; height:720px; background:#FFFFFF; }
.topbar { position:absolute; left:0; top:0; width:1280px; height:75px; background:#002060; }
.topbar .sec { position:absolute; left:16px; top:12px; font-size:20px; font-weight:700; color:#FFFFFF; }
.topbar .logo { position:absolute; right:35px; top:18px; width:168px; height:37px; background:#1E3A8A; border-radius:4px; }
.bottombar { position:absolute; left:0; bottom:0; width:1280px; height:54px; background:#F1F5F9;
  border-top:1px solid #E2E8F0; }
.bottombar .logo { position:absolute; right:35px; bottom:8px; width:187px; height:38px; background:#CBD5E1; border-radius:4px; }
.lead { position:absolute; left:35px; top:92px; width:1179px; font-size:15px; line-height:1.6; color:#1E293B; }
.left-img { position:absolute; left:43px; top:260px; width:694px; height:317px;
  background:#F1F5F9; border-radius:6px; overflow:hidden; }
.left-img img { width:100%; height:100%; object-fit:contain; }
.right { position:absolute; left:774px; top:212px; width:431px; bottom:74px; }
.right .hd { height:40px; background:#002060; color:#FFFFFF; font-size:16px; font-weight:700;
  display:flex; align-items:center; padding-left:14px; }
.right .imgbox { margin-top:15px; height:188px; background:#F1F5F9; border-radius:6px; overflow:hidden; }
.right .imgbox img { width:100%; height:100%; object-fit:contain; }
.right .cap { margin-top:12px; font-size:13px; font-weight:600; color:#1E293B; line-height:1.5; }
</style>
</head>
<body>
<div class="slide">
  <div class="topbar"><div class="sec">{{SECTION}}</div><div class="logo"></div></div>
  <div class="lead">{{LEAD}}</div>
  <div class="left-img"><img src="{{IMG}}"></div>
  <div class="right">
    <div class="hd">{{RIGHT_TITLE}}</div>
    <div class="imgbox"><img src="{{RIGHT_IMG}}"></div>
    <div class="cap">{{RIGHT_CAP}}</div>
  </div>
  <div class="bottombar"><div class="logo"></div></div>
</div>
</body>
</html>
