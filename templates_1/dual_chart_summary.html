<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#FFFFFF; }
.slide { position:relative; width:1280px; height:720px; background:#F5F5F0; }
.kicker { position:absolute; left:60px; top:30px; font-size:14px; color:#64748B; letter-spacing:3px; white-space:nowrap; }
.title { position:absolute; left:60px; top:54px; width:1160px; font-size:32px; font-weight:800; color:#0F172A; }
.subtitle { position:absolute; left:60px; top:106px; width:1160px; font-size:20px; color:#64748B; font-style:italic; }
.charts { position:absolute; left:60px; top:150px; width:1160px; display:flex; gap:20px; }
.ccard { flex:1; background:#F5F5F0; border-top:3px solid #2563EB; padding:16px; height:360px; }
.ccard .ct { font-size:19px; font-weight:700; color:#0F172A; text-align:center; margin-bottom:10px; }
.ccard .cb { flex:1; }
.ccard .cap { font-size:15px; color:#64748B; text-align:center; margin-top:6px; font-style:italic; }
.note { position:absolute; left:0; top:540px; width:1280px;
  background:#F5F5F0; border-left:4px solid #2563EB; padding: 14px 60px; }
.note .txt { font-size:19px; line-height:1.5; color:#1E293B; ; width:100%; }
.note .bar, .summary .bar { position:absolute; left:0; top:0; width:4px; height:100%; background:#2563EB; }
.note.n2 .bar { background:#16A34A; }
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="charts">
    <div class="ccard"><div class="ct">{{CHART1_TITLE}}</div><div class="cb">{{CHART1}}</div>
      <div class="cap">{{CAPTION1}}</div></div>
    <div class="ccard"><div class="ct">{{CHART2_TITLE}}</div><div class="cb">{{CHART2}}</div>
      <div class="cap">{{CAPTION2}}</div></div>
  </div>
  <div class="note"><div class="txt">{{NOTE}}</div></div>
</div>
</body>
</html>
